[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    unit: Unit tests (isolated logic)
    integration: Integration tests (cross-service)
    ui: UI/End-to-end tests
    docker: Docker containerization tests
    slow: Slow tests (skip in quick runs)
