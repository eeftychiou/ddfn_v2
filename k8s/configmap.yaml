apiVersion: v1
kind: ConfigMap
metadata:
  name: ddfn-config
  namespace: ddfn-v2
  labels:
    app.kubernetes.io/name: ddfn-v2
    app.kubernetes.io/component: config
data:
  # Broker configuration
  DDFN_BROKER_HOST: "broker"
  DDFN_BROKER_PORT: "8001"
  
  # FMP configuration
  DDFN_FMP_MEASURE_WINDOW: "120"
  DDFN_FMP_DEFAULT_CAPACITY: "40"
  
  # Airport configuration
  DDFN_AIRPORT_DEFAULT_AAR: "30"
  DDFN_AIRPORT_DEFAULT_ADR: "28"
  
  # Paths
  DDFN_CONFIG_DIR: "data/node_configs"
  DDFN_LOGS_DIR: "logs"
  DDFN_DATA_DIR: "data"
  
  # Python path
  PYTHONPATH: "src"
